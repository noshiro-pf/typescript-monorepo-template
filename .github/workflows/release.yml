name: Release

on:
  push:
    branches:
      - main

env:
  CI: true

jobs:
  release:
    name: Release
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write # to create release
      issues: write # to post issue comments
      pull-requests: write # to create pull request
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          registry-url: https://npm.pkg.github.com/
          scope: '@noshiro-pf'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REPO_AUTOMATION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.REPO_AUTOMATION_BOT_PRIVATE_KEY }}
          # App が持つ全権限をそのまま受け取らないよう、release に必要な範囲へ明示的に絞る。
          permission-contents: write # version ブランチの push / タグ / GitHub Release の作成
          permission-pull-requests: write # version PR の作成と更新

      - name: Create Release Pull Request or Publish
        id: changesets
        # この action のメジャーは @changesets/cli のメジャーと対で選ぶこと。
        # v2 は publish した内容を、CHANGESETS_OUTPUT が指す一時ファイル経由で
        # CLI から受け取る。これを書けるのは CLI v3 以降。
        # v1 は代わりに publish スクリプトの標準出力から `New tag: <pkg>@<ver>`
        # という行を正規表現で拾う実装で、その行を出さなくなった CLI v3 と
        # 組み合わせると 1 件もマッチせず、publish 自体は成功するのに
        # git tag の push と GitHub Release の作成がエラーも出さずに丸ごと
        # 飛ぶ（package-a@1.0.2 / package-b@0.1.1 が実際にそうなった）。
        # @changesets/cli を v2 系に戻すなら、この action も v1 に戻すこと。
        # pnpm-update.yml がこのピンを勝手にメジャー更新しないことは
        # pnpm-workspace.yaml の `update.githubActions: false` が担保している。
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          # v2 で入力名が全て改名された
          # （publish → publish-script, version → version-script,
          #   title → pr-title, commit → commit-message）。
          # トークンも env ではなく github-token 入力で渡す。
          github-token: ${{ steps.app-token.outputs.token }}
          publish-script: pnpm run ci:publish
          version-script: pnpm run ci:version-packages
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
        env:
          # GITHUB_TOKEN は env で渡さないこと。v2 は github-token 入力と
          # 値が食い違う GITHUB_TOKEN を見つけると即エラーになる。publish /
          # version スクリプトには action 側が同じトークンを注入する。
          #
          # GitHub Packages への publish は自リポジトリ向けなので GITHUB_TOKEN で足りる
          # （ job に packages: write を付与済み ）。install ステップも同じトークンを使う。
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
