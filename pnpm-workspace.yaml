packages:
  - packages/**

update:
  # GitHub Actions のピンは `update-packages` ではなく `update-actions` が動かす。
  # ここを true にすると `--latest` の付いた `update-packages` が actions も
  # メジャー更新してしまい、`changesets/action` v1 → v2 のような、設定の書き換えを
  # 伴う更新が無人でマージされる。`update-actions` は同一メジャー内でしか動かさない
  # ので、メジャー更新は人間が判断することになる。
  #
  # pnpm の `--include-github-actions` には `minimumReleaseAge` が効かない。pnpm は
  # actions のバージョンを `git ls-remote` の ref 一覧から取っており、タグの公開日時を
  # 持たないため。そこで `update-actions` は pnpm ではなく
  # `scripts/cmd/mature-updates.mts actions` を動かし、GitHub Releases の
  # `published_at` で同じ保留を適用する。下の `ignoreDeps` は actions には適用されない。
  githubActions: false
  ignoreDeps:
    - typescript

minimumReleaseAge: 10080 # = 7 days

minimumReleaseAgeExclude:
  - '@types/**'
  # `octokit-safe-types` と `github-settings-as-code` が引き込む推移的依存。
  # 親を除外してもその依存先は除外されないため、`@octokit/*` が公開直後だと
  # `pnpm update --latest` が ERR_PNPM_NO_MATURE_MATCHING_VERSION で落ちる。
  - '@octokit/**'
  - ts-type-forge
  - eslint-plugin-ts-type-forge
  - ts-std-forge
  - eslint-plugin-ts-std-forge
  - ts-data-forge
  - eslint-plugin-ts-data-forge
  - ts-fortress
  - eslint-plugin-ts-fortress
  - ts-repo-utils
  - ts-codemod-lib
  - synstate
  - 'synstate-*'
  - eslint-config-typed
  - octokit-safe-types
  - github-settings-as-code
  - 'strict-ts-lib-*'

allowBuilds:
  esbuild: true
  unrs-resolver: true
